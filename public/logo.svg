
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" fill="none">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".48" stop-color="#AEB4BC"/>
      <stop offset="1" stop-color="#626A73"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFC16B"/>
      <stop offset=".45" stop-color="#FF6B00"/>
      <stop offset="1" stop-color="#C94100"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8F6A2C"/>
      <stop offset=".5" stop-color="#F2D28A"/>
      <stop offset="1" stop-color="#A77A34"/>
    </linearGradient>
  </defs>

  <!-- Escudo -->
  <path d="M500 13 L720 65 L704 190 Q670 251 500 294 Q330 251 296 190 L280 65 Z"
        stroke="url(#gold)" stroke-width="5"/>
  <path d="M500 25 L707 74 L692 184 Q660 235 500 276 Q340 235 308 184 L293 74 Z"
