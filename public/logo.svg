  <!-- Nome -->
  <text x="500" y="226" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="102" font-weight="900" letter-spacing="-5">
    <tspan fill="url(#silver)">VT</tspan><tspan fill="url(#orange)">CAR</tspan>
  </text>

  <!-- Premium -->
  <path d="M230 250 H365 M635 250 H770" stroke="url(#gold)" stroke-width="2"/>
  <text x="500" y="260" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
