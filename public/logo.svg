        fill="url(#gold)">PREMIUM</text>

  <!-- Slogan -->
  <text x="500" y="285" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="500" letter-spacing="5"
        fill="#D5D8DC">MOVEMOS CONQUISTAS</text>
</svg>
