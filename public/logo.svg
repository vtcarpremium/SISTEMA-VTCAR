  <!-- Carro esportivo -->
  <path d="M348 158 L378 117 Q393 99 425 96 L570 96 Q606 98 628 122 L658 158"
        stroke="url(#silver)" stroke-width="8" stroke-linecap="round"/>
  <path d="M388 117 L422 101 L575 101 L615 119"
        stroke="#AEB4BC" stroke-width="3"/>
  <path d="M338 160 L379 143 L430 137 L572 137 L624 143 L663 160"
        stroke="url(#orange)" stroke-width="7" stroke-linecap="round"/>
  <path d="M350 161 L374 177 L626 177 L651 161"
        stroke="url(#silver)" stroke-width="5" stroke-linecap="round"/>
  <path d="M365 159 L399 151 L418 151" stroke="#FF6B00" stroke-width="5"/>
  <path d="M635 159 L601 151 L582 151" stroke="#FF6B00" stroke-width="5"/>
  <path d="M450 106 L431 135 M550 106 L569 135"
